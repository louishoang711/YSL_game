<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>YSL Holiday Show</title>
<style>
  @font-face { font-family: Singulier; src: url(/game/assets/fonts/Singulier-Light.woff2) format("woff2"); font-weight: 300; }
  @font-face { font-family: Singulier; src: url(/game/assets/fonts/Singulier-Demi.woff2) format("woff2"); font-weight: 600; }

  :root {
    --wine-950: #16020a; --wine-900: #24040c; --wine-800: #3a0711; --wine-700: #560c19; --wine-600: #741524;
    --gold-100: #fbefcb; --gold-300: #e6cb8f; --gold-500: #c9a463; --gold-700: #8f6b3a;
    --gold-line: linear-gradient(135deg, var(--gold-100), var(--gold-500) 28%, var(--gold-700) 50%, var(--gold-300) 72%, var(--gold-100));
    /* Khung chơi: chỉnh --top để đưa game cao/thấp; luôn căn giữa ngang */
    --top: 2.6vh; --w: 88vw; --h: 68vh;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body {
    background:
      radial-gradient(90% 55% at 50% 34%, var(--wine-600) 0%, var(--wine-700) 30%, var(--wine-800) 62%, var(--wine-900) 85%, var(--wine-950) 100%);
    color: var(--gold-300); font-family: Singulier, "Segoe UI", sans-serif;
  }
  /* lưới hình thoi rất mờ (motif kim cương YSL), đậm dần xuống dưới */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(45deg, rgba(230, 203, 143, .07) 0 1px, transparent 1px 56px),
      repeating-linear-gradient(-45deg, rgba(230, 203, 143, .07) 0 1px, transparent 1px 56px);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 75%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 75%);
  }

  .stage { position: absolute; left: 50%; top: var(--top); width: var(--w); height: var(--h); transform: translateX(-50%); }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--wine-800); }
  /* viền vàng đôi: nét liền sát game + nét mảnh bên ngoài */
  .stage::after { content: ""; position: absolute; inset: -4px; border: 3px solid transparent; border-image: var(--gold-line) 1; pointer-events: none; box-shadow: 0 2.5vh 7vh rgba(0, 0, 0, .6); }
  .stage::before { content: ""; position: absolute; inset: -16px; border: 1px solid rgba(230, 203, 143, .5); pointer-events: none; }
  .corner { position: absolute; width: 14px; height: 14px; background: var(--gold-line); transform: translate(-50%, -50%) rotate(45deg); pointer-events: none; }
  .tl { left: -16px; top: -16px; } .tr { left: calc(100% + 16px); top: -16px; }
  .bl { left: -16px; top: calc(100% + 16px); } .br { left: calc(100% + 16px); top: calc(100% + 16px); }

  .brand {
    position: absolute; left: 0; right: 0; top: calc(var(--top) + var(--h) + 16px); bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh; pointer-events: none;
  }
  .diamond { position: relative; height: 15vh; aspect-ratio: 540 / 512; filter: drop-shadow(0 1.2vh 2.4vh rgba(0, 0, 0, .55)); }
  .diamond img { width: 100%; height: 100%; display: block; }
  .caption { display: flex; align-items: center; gap: 1.6vw; font-weight: 300; font-size: 1.9vh; letter-spacing: .55em; text-transform: uppercase; color: var(--gold-300); }
  .caption::before, .caption::after { content: ""; width: 9vw; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-500)); }
  .caption::after { transform: scaleX(-1); }
  .caption b { font-weight: 600; color: var(--gold-100); }
</style>
</head>
<body>
  <div class="stage">
    <iframe src="/game/" title="YSL Holiday Show" allow="autoplay; fullscreen"></iframe>
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
  </div>
  <div class="brand" aria-hidden="true">
    <div class="diamond"><img src="diamond.png" alt="" /></div>
    <div class="caption"><span><b>Holiday</b> Show</span></div>
  </div>
<script>
  // Chỉnh nhanh qua URL: /?top=2.6&w=88&h=68
  const q = new URLSearchParams(location.search);
  for (const [k, unit] of [["top", "vh"], ["w", "vw"], ["h", "vh"]])
    if (q.has(k)) document.documentElement.style.setProperty("--" + k, parseFloat(q.get(k)) + unit);
  // chèn pháo giấy sắc nét + chỉnh giao diện vào game (cùng origin nên truy cập được)
  const f = document.querySelector("iframe");
  f.addEventListener("load", () => {
    const d = f.contentDocument;
    for (const src of ["/confetti.js", "/press-fx.js"]) { const s = d.createElement("script"); s.src = src; d.head.appendChild(s); }
    const l = d.createElement("link"); l.rel = "stylesheet"; l.id = "kiosk-tweaks"; l.href = "/game-tweaks.css"; d.head.appendChild(l);
  });
</script>
</body>
</html>
